[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "music-project"
version = "0.0.1"
description = "Audio-to-symbolic-score experiments targeting TuxGuitar .tg output."
requires-python = ">=3.11"

[project.scripts]
melody-to-tg = "music_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

